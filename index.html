<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1117">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Relatórios MT">
<title>Marles Têxtil — Relatórios</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f0f2f7; font-family:'DM Sans',sans-serif; min-height:100vh; color:#0f1117; }

/* ── LOGIN ── */
#loginScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:#f0f2f7; }
.login-box { background:#fff; border:1px solid #e2e5ef; padding:52px 44px; max-width:400px; width:100%; box-shadow:0 8px 40px rgba(0,0,0,.08); }
.login-logo { font-family:'Playfair Display',serif; font-size:11px; letter-spacing:5px; text-transform:uppercase; color:#9ca3af; margin-bottom:32px; text-align:center; }
.login-title { font-family:'Playfair Display',serif; font-size:24px; color:#0f1117; margin-bottom:8px; text-align:center; line-height:1.25; }
.login-sub { font-size:12px; color:#9ca3af; margin-bottom:36px; text-align:center; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:10px; font-weight:600; color:#7b8099; margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; }
.field input { width:100%; padding:13px 16px; border:1.5px solid #e2e5ef; font-family:'DM Sans',sans-serif; font-size:13px; color:#0f1117; outline:none; transition:border .15s; border-radius:0; }
.field input:focus { border-color:#0f1117; }
.field input::placeholder { color:#c4c9d4; }
.btn-enter { width:100%; padding:14px; background:#0f1117; color:#fff; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; border:none; cursor:pointer; margin-top:8px; letter-spacing:.5px; transition:background .15s; }
.btn-enter:hover { background:#1d4ed8; }
.btn-enter:disabled { background:#c4c9d4; cursor:not-allowed; }
.err-msg { font-size:11px; color:#c8291a; margin-top:12px; text-align:center; min-height:16px; }

/* ── HUB ── */
#hubScreen { display:none; min-height:100vh; }

/* TOPBAR */
.topbar { background:#fff; border-bottom:1px solid #e8eaf0; display:flex; align-items:center; justify-content:space-between; padding:0 48px; height:60px; position:sticky; top:0; z-index:100; box-shadow:0 1px 12px rgba(0,0,0,.05); }
.topbar-brand { font-family:'Playfair Display',serif; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:#0f1117; }
.topbar-right { display:flex; align-items:center; gap:20px; }
.topbar-user { font-size:11px; color:#9ca3af; }
.btn-admin { font-size:11px; font-weight:600; color:#1d4ed8; text-decoration:none; padding:7px 16px; border:1.5px solid #1d4ed8; transition:all .15s; letter-spacing:.3px; }
.btn-admin:hover { background:#1d4ed8; color:#fff; }
.btn-logout { font-size:11px; font-weight:600; color:#9ca3af; background:none; border:none; cursor:pointer; letter-spacing:.3px; }
.btn-logout:hover { color:#c8291a; }

/* HUB CONTENT */
.hub-wrap { max-width:980px; margin:0 auto; padding:52px 32px 80px; }
.hub-eyebrow { font-size:10px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:#9ca3af; text-align:center; margin-bottom:10px; }
.hub-heading { font-family:'Playfair Display',serif; font-size:32px; font-weight:700; color:#0f1117; text-align:center; margin-bottom:56px; line-height:1.2; }

/* COMPANY CARDS */
.companies { display:flex; flex-direction:column; gap:20px; }

.company-card {
  background:#fff;
  border:1px solid #e8eaf0;
  overflow:hidden;
  box-shadow:0 2px 16px rgba(0,0,0,.04);
  transition:box-shadow .2s, transform .2s;
}
.company-card:hover { box-shadow:0 6px 32px rgba(0,0,0,.08); transform:translateY(-1px); }

.company-header {
  display:flex;
  align-items:center;
  gap:20px;
  padding:24px 32px;
  border-bottom:1px solid #f0f2f7;
  position:relative;
}
.company-stripe {
  position:absolute;
  left:0; top:0; bottom:0;
  width:4px;
}
.company-icon-wrap {
  width:44px; height:44px;
  border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px;
  flex-shrink:0;
}
.company-info { flex:1; }
.company-name {
  font-family:'Playfair Display',serif;
  font-size:16px; font-weight:700; color:#0f1117;
  margin-bottom:3px;
}
.company-meta { font-size:11px; color:#9ca3af; }
.company-pill {
  font-size:9px; font-weight:700;
  letter-spacing:1.5px; text-transform:uppercase;
  padding:5px 12px; border-radius:100px;
}

/* REPORTS GRID */
.reports-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
  gap:0;
}
.report-item {
  padding:22px 28px;
  text-decoration:none;
  color:#0f1117;
  display:flex;
  flex-direction:column;
  gap:5px;
  transition:all .15s;
  border-right:1px solid #f0f2f7;
  border-bottom:1px solid #f0f2f7;
  position:relative;
  cursor:pointer;
}
.report-item:hover:not(.soon) { background:#f7f9ff; }
.report-item:hover:not(.soon) .report-label { color:#1d4ed8; }
.report-item:hover:not(.soon) .report-arrow { opacity:1; transform:translateX(3px); }
.report-item.soon { opacity:.4; cursor:default; pointer-events:none; }

.report-item-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.report-color-dot { width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; }
.report-arrow { color:#c4c9d4; font-size:16px; opacity:0; transition:all .15s; }
.report-label { font-size:13px; font-weight:600; color:#0f1117; line-height:1.3; }
.report-sub { font-size:10px; color:#9ca3af; line-height:1.4; }
.report-total { font-size:11px; font-weight:600; color:#3b82f6; margin-top:4px; }
.soon-tag { font-size:8px; font-weight:700; letter-spacing:1px; text-transform:uppercase; background:#f3f4f6; color:#9ca3af; padding:3px 7px; border-radius:100px; align-self:flex-start; margin-top:4px; }

.loading-msg { text-align:center; padding:80px; color:#9ca3af; font-size:13px; }
.hub-footer { text-align:center; margin-top:56px; font-size:10px; color:#c4c9d4; letter-spacing:1px; }

/* --- notificações de relatórios novos/atualizados --- */
.notif-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:#eff4ff;border:1px solid #c7d7fe;border-left:4px solid #1d4ed8;
  padding:12px 16px;margin-bottom:20px;border-radius:4px;font-size:13px;color:#0f1117;}
.notif-banner .notif-items{display:block;font-size:11px;color:#7b8099;margin-top:2px;}
.notif-banner button{flex-shrink:0;background:#1d4ed8;color:#fff;border:none;padding:8px 14px;
  font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;border-radius:4px;cursor:pointer;}
.new-tag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  background:#1d4ed8;color:#fff;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle;}
.new-tag.upd{background:#d97706;}
.report-item.is-fresh{border-color:#1d4ed8;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Marles Têxtil</div>
    <div class="login-title">Relatórios<br>Internos</div>
    <p class="login-sub">Acesso restrito · Uso interno</p>
    <div class="field"><label>E-mail</label><input type="email" id="loginEmail" placeholder="seu@email.com" onkeydown="if(event.key==='Enter')login()"></div>
    <div class="field"><label>Senha</label><input type="password" id="loginPwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn-enter" id="loginBtn" onclick="login()">Entrar</button>
    <div class="err-msg" id="loginErr"></div>
  </div>
</div>

<!-- HUB -->
<div id="hubScreen">
  <div class="topbar">
    <div class="topbar-brand">Marles Têxtil</div>
    <div class="topbar-right">
      <span class="topbar-user" id="userEmail"></span>
      <a href="admin.html" class="btn-admin" id="adminLink" style="display:none">⚙ Admin</a>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="hub-wrap">
    <div class="hub-eyebrow">Marles Têxtil · Matriz</div>
    <div class="hub-heading">Central de Relatórios</div>
    <div class="companies" id="companiesContainer">
      <div class="loading-msg">Carregando...</div>
    </div>
    <div class="hub-footer">MARLES TÊXTIL · USO INTERNO · <span id="yr"></span></div>
  </div>
</div>

<script>
const SURL = 'https://ihlrzanoirwbhftaytbh.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlobHJ6YW5vaXJ3YmhmdGF5dGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMjQ4MTEsImV4cCI6MjA5NDcwMDgxMX0.GuVTLZV-Xlc7YbSslex9Q8lcta0ZBgHfLynFaqOHV5M';
const sb = supabase.createClient(SURL, SKEY);

document.getElementById('yr').textContent = new Date().getFullYear();

// Visual config per category
function catStyle(title) {
  const t = title.toLowerCase();
  if (t.includes('malha') || t.includes('gabi') || t.includes('tecidos'))
    return { stripe:'#c8291a', iconBg:'#fff0ef', pill:'#fff0ef', pillText:'#c8291a', dotBg:'#fff0ef' };
  if (t.includes('pessoal') || t.includes('michpa'))
    return { stripe:'#7c3aed', iconBg:'#f5f3ff', pill:'#ede9fe', pillText:'#7c3aed', dotBg:'#f5f3ff' };
  if (t.includes('comercial'))
    return { stripe:'#059669', iconBg:'#f0fdf4', pill:'#dcfce7', pillText:'#059669', dotBg:'#f0fdf4' };
  if (t.includes('admin'))
    return { stripe:'#d97706', iconBg:'#fffbeb', pill:'#fef3c7', pillText:'#b45309', dotBg:'#fffbeb' };
  if (t.includes('analise') || t.includes('análise') || t.includes('folha'))
    return { stripe:'#0891b2', iconBg:'#ecfeff', pill:'#cffafe', pillText:'#0e7490', dotBg:'#ecfeff' };
  if (t.includes('margem') || t.includes('importado'))
    return { stripe:'#f59e0b', iconBg:'#fffbeb', pill:'#fef3c7', pillText:'#92400e', dotBg:'#fffbeb' };
  // default — Marles produção
  return { stripe:'#1d4ed8', iconBg:'#eff6ff', pill:'#dbeafe', pillText:'#1d4ed8', dotBg:'#eff6ff' };
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await showHub(session.user);
})();

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const pwd   = document.getElementById('loginPwd').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('loginErr');
  if (!email || !pwd) { err.textContent = 'Preencha e-mail e senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...'; err.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error) { err.textContent = 'E-mail ou senha incorretos.'; btn.disabled = false; btn.textContent = 'Entrar'; return; }
  await showHub(data.user);
}

async function showHub(user) {
  const { data: profile } = await sb.from('profiles').select('role').eq('id', user.id).single();
  const role = profile?.role || 'viewer';
  document.getElementById('loginScreen').style.display  = 'none';
  document.getElementById('hubScreen').style.display    = 'block';
  document.getElementById('userEmail').textContent       = user.email;
  if (role === 'master') document.getElementById('adminLink').style.display = 'inline';
  await loadCompanies();
}

async function loadCompanies() {
  const { data: cats } = await sb.from('categories')
    .select('*, reports(*)')
    .eq('active', true)
    .order('position');

  // --- notificações: comparar updated_at com o que este aparelho já viu ---
  const SEEN_KEY = 'marles_seen_v1';
  let seen = {}; try { seen = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}'); } catch(e) {}
  const firstVisit = !localStorage.getItem(SEEN_KEY);
  const allReps = (cats || []).flatMap(c => (c.reports || []).filter(r => r.active && !r.coming_soon));
  if (firstVisit) { allReps.forEach(r => seen[r.id] = r.updated_at || new Date().toISOString());
    localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); }
  const fresh = allReps.filter(r => r.updated_at && (!seen[r.id] || new Date(r.updated_at) > new Date(seen[r.id])));
  const freshIds = new Set(fresh.map(r => r.id));
  const isNewIds = new Set(fresh.filter(r => !seen[r.id]).map(r => r.id));
  window._markSeen = (id, ts) => { seen[id] = ts || new Date().toISOString();
    localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); };
  window._markAllSeen = () => { allReps.forEach(r => seen[r.id] = r.updated_at || new Date().toISOString());
    localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); loadCompanies(); };

  const container = document.getElementById('companiesContainer');
  if (!cats?.length) { container.innerHTML = '<div class="loading-msg">Nenhum relatório disponível.</div>'; return; }

  container.innerHTML = cats.map(cat => {
    const style   = catStyle(cat.title);
    const reports = (cat.reports || []).filter(r => r.active).sort((a,b) => a.position - b.position);
    const activeN = reports.filter(r => !r.coming_soon).length;
    const pillTxt = activeN > 0 ? `${activeN} relatório${activeN > 1 ? 's' : ''}` : 'Em breve';

    const cards = reports.map(r => {
      // Color dot background based on report color
      const dotBg = r.color + '22';  // 13% opacity hex
      if (r.coming_soon) {
        return `<div class="report-item soon">
          <div class="report-item-top">
            <div class="report-color-dot" style="background:${dotBg}">
              <div style="width:8px;height:8px;border-radius:50%;background:${r.color};opacity:.4;"></div>
            </div>
          </div>
          <div class="report-label">${r.label}</div>
          <div class="report-sub">${r.description}</div>
          <span class="soon-tag">Em breve</span>
        </div>`;
      }
      const isFresh = freshIds.has(r.id);
      const freshTag = isFresh ? `<span class="new-tag${isNewIds.has(r.id) ? '' : ' upd'}">${isNewIds.has(r.id) ? 'Novo' : 'Atualizado'}</span>` : '';
      return `<a class="report-item${isFresh ? ' is-fresh' : ''}" href="${r.file_url}" onclick="_markSeen('${r.id}','${r.updated_at || ''}')">
        <div class="report-item-top">
          <div class="report-color-dot" style="background:${dotBg}">
            <div style="width:8px;height:8px;border-radius:50%;background:${r.color};"></div>
          </div>
          <span class="report-arrow">›</span>
        </div>
        <div class="report-label">${r.label}${freshTag}</div>
        <div class="report-sub">${r.description}</div>
      </a>`;
    }).join('');

    return `<div class="company-card">
      <div class="company-header">
        <div class="company-stripe" style="background:${style.stripe}"></div>
        <div class="company-icon-wrap" style="background:${style.iconBg}; margin-left:12px;">
          ${cat.icon}
        </div>
        <div class="company-info">
          <div class="company-name">${cat.title}</div>
          <div class="company-meta">${cat.description}</div>
        </div>
        <span class="company-pill" style="background:${style.pill};color:${style.pillText}">${pillTxt}</span>
      </div>
      <div class="reports-grid">${cards}</div>
    </div>`;
  }).join('');

  if (fresh.length) {
    const items = fresh.slice(0, 5).map(r => r.label).join(' · ');
    container.insertAdjacentHTML('afterbegin',
      `<div class="notif-banner"><div>🔔 <b>${fresh.length === 1 ? '1 relatório novo ou atualizado' : fresh.length + ' relatórios novos ou atualizados'}</b><span class="notif-items">${items}${fresh.length > 5 ? ' · …' : ''}</span></div><button onclick="_markAllSeen()">Marcar como visto</button></div>`);
  }
}

// Ao voltar de um relatório (gesto de voltar, botão Hub ou retomada do app),
// recarrega os cards para as etiquetas de novo/atualizado sumirem sozinhas.
// Vários eventos são ouvidos porque cada celular/navegador dispara um diferente;
// a trava de 1s evita recarregar em duplicidade quando mais de um dispara junto.
function hubVisible() { return document.getElementById('hubScreen').style.display === 'block'; }
let _lastHubReload = 0;
function refreshHub() {
  if (!hubVisible()) return;
  const now = Date.now();
  if (now - _lastHubReload < 1000) return;
  _lastHubReload = now;
  loadCompanies();
}
window.addEventListener('pageshow', refreshHub);
window.addEventListener('focus', refreshHub);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refreshHub();
});

async function logout() {
  await sb.auth.signOut();
  document.getElementById('hubScreen').style.display  = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPwd').value   = '';
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
