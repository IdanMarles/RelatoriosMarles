<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marles Têxtil — Relatórios</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f0f2f7; font-family:'DM Sans',sans-serif; min-height:100vh; color:#0f1117; }

/* ── LOGIN ── */
#loginScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.login-box { background:#fff; border:1px solid #e2e5ef; padding:48px 40px; max-width:380px; width:100%; box-shadow:0 4px 24px rgba(0,0,0,.06); }
.login-brand { font-family:'Playfair Display',serif; font-size:11px; letter-spacing:4px; text-transform:uppercase; color:#7b8099; margin-bottom:10px; text-align:center; }
.login-title { font-family:'Playfair Display',serif; font-size:22px; color:#0f1117; margin-bottom:6px; text-align:center; }
.login-sub { font-size:12px; color:#9ca3af; margin-bottom:32px; text-align:center; }
.field { margin-bottom:12px; }
.field label { display:block; font-size:11px; font-weight:600; color:#7b8099; margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
.field input { width:100%; padding:12px 14px; border:1px solid #e2e5ef; font-family:'DM Sans',sans-serif; font-size:13px; color:#0f1117; outline:none; transition:border .15s; }
.field input:focus { border-color:#1d4ed8; }
.btn-login { width:100%; padding:13px; background:#0f1117; color:#fff; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; border:none; cursor:pointer; margin-top:8px; transition:background .15s; }
.btn-login:hover { background:#1d4ed8; }
.btn-login:disabled { background:#9ca3af; cursor:not-allowed; }
.err-msg { font-size:11px; color:#c8291a; margin-top:10px; text-align:center; min-height:16px; }

/* ── HUB ── */
#hubScreen { display:none; min-height:100vh; }

/* TOPBAR */
.topbar { background:#fff; border-bottom:1px solid #e2e5ef; display:flex; align-items:center; justify-content:space-between; padding:0 40px; height:56px; position:sticky; top:0; z-index:100; box-shadow:0 1px 8px rgba(0,0,0,.05); }
.topbar-brand { font-family:'Playfair Display',serif; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:#0f1117; }
.topbar-right { display:flex; align-items:center; gap:16px; }
.topbar-user { font-size:11px; color:#9ca3af; }
.btn-admin { font-size:11px; font-weight:600; color:#1d4ed8; text-decoration:none; padding:6px 14px; border:1px solid #1d4ed8; transition:all .15s; }
.btn-admin:hover { background:#1d4ed8; color:#fff; }
.btn-logout { font-size:11px; font-weight:600; color:#7b8099; background:none; border:none; cursor:pointer; }
.btn-logout:hover { color:#c8291a; }

/* HUB CONTENT */
.hub-wrap { max-width:960px; margin:0 auto; padding:48px 32px 80px; }
.hub-title { font-family:'Playfair Display',serif; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:#9ca3af; text-align:center; margin-bottom:8px; }
.hub-heading { font-family:'Playfair Display',serif; font-size:30px; font-weight:700; color:#0f1117; text-align:center; margin-bottom:48px; }

/* COMPANY CARDS */
.companies { display:flex; flex-direction:column; gap:24px; }

.company-card {
  background:#fff;
  border:1px solid #e2e5ef;
  overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.04);
  transition:box-shadow .2s;
}
.company-card:hover { box-shadow:0 4px 24px rgba(0,0,0,.08); }

.company-header {
  display:flex;
  align-items:center;
  gap:16px;
  padding:24px 32px;
  border-bottom:1px solid #f0f1f5;
}
.company-accent {
  width:4px;
  height:48px;
  border-radius:2px;
  flex-shrink:0;
}
.company-info { flex:1; }
.company-name {
  font-family:'Playfair Display',serif;
  font-size:17px;
  font-weight:700;
  color:#0f1117;
  margin-bottom:3px;
}
.company-desc { font-size:11px; color:#9ca3af; }
.company-badge {
  font-size:9px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:4px 10px;
  border-radius:2px;
}

/* REPORT GRID inside card */
.reports-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
  gap:1px;
  background:#f0f1f5;
}
.report-item {
  background:#fff;
  padding:20px 24px;
  text-decoration:none;
  color:#0f1117;
  display:flex;
  flex-direction:column;
  gap:6px;
  transition:all .15s;
  cursor:pointer;
  position:relative;
}
.report-item:hover:not(.soon) {
  background:#f5f8ff;
  z-index:1;
}
.report-item.soon { opacity:.45; cursor:default; pointer-events:none; background:#fafbfd; }
.report-dot { width:6px; height:6px; border-radius:50%; margin-bottom:2px; }
.report-label { font-size:13px; font-weight:600; color:#0f1117; }
.report-item:hover:not(.soon) .report-label { color:#1d4ed8; }
.report-sub { font-size:10px; color:#9ca3af; line-height:1.4; }
.report-arrow {
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  color:#d1d5db;
  font-size:14px;
  transition:all .15s;
}
.report-item:hover:not(.soon) .report-arrow { color:#1d4ed8; transform:translateY(-50%) translateX(2px); }
.soon-tag {
  display:inline-block;
  font-size:8px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:uppercase;
  background:#f3f4f6;
  color:#9ca3af;
  padding:2px 6px;
  border-radius:2px;
  align-self:flex-start;
}

.loading-msg { text-align:center; padding:60px; color:#9ca3af; font-size:13px; }
.hub-footer { text-align:center; margin-top:48px; font-size:10px; color:#c4c9d4; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-brand">Marles Têxtil</div>
    <div class="login-title">Relatórios Internos</div>
    <p class="login-sub">Acesso restrito · Uso interno</p>
    <div class="field"><label>E-mail</label><input type="email" id="loginEmail" placeholder="seu@email.com" onkeydown="if(event.key==='Enter')login()"></div>
    <div class="field"><label>Senha</label><input type="password" id="loginPwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn-login" id="loginBtn" onclick="login()">Entrar</button>
    <div class="err-msg" id="loginErr"></div>
  </div>
</div>

<!-- HUB -->
<div id="hubScreen">
  <div class="topbar">
    <div class="topbar-brand">Marles Têxtil</div>
    <div class="topbar-right">
      <span class="topbar-user" id="userEmail"></span>
      <a href="admin.html" class="btn-admin" id="adminLink" style="display:none">⚙ Admin</a>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="hub-wrap">
    <div class="hub-title">Marles Têxtil · Matriz</div>
    <div class="hub-heading">Central de Relatórios</div>
    <div class="companies" id="companiesContainer">
      <div class="loading-msg">Carregando...</div>
    </div>
    <div class="hub-footer">Marles Têxtil · Uso interno · <span id="footerYear"></span></div>
  </div>
</div>

<script>
const SURL = 'https://ihlrzanoirwbhftaytbh.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlobHJ6YW5vaXJ3YmhmdGF5dGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMjQ4MTEsImV4cCI6MjA5NDcwMDgxMX0.GuVTLZV-Xlc7YbSslex9Q8lcta0ZBgHfLynFaqOHV5M';
const sb = supabase.createClient(SURL, SKEY);

document.getElementById('footerYear').textContent = new Date().getFullYear();

// Accent colors per category (mapped by position or title keywords)
function accentColor(title) {
  const t = title.toLowerCase();
  if (t.includes('malha') || t.includes('gabi') || t.includes('tecidos')) return { bg:'#fef3f2', accent:'#c8291a', badge:'#fff0ef', badgeText:'#c8291a' };
  if (t.includes('pessoal') || t.includes('michpa')) return { bg:'#f5f3ff', accent:'#7c3aed', badge:'#ede9fe', badgeText:'#7c3aed' };
  if (t.includes('comercial')) return { bg:'#f0fdf4', accent:'#059669', badge:'#dcfce7', badgeText:'#059669' };
  return { bg:'#eff6ff', accent:'#1d4ed8', badge:'#dbeafe', badgeText:'#1d4ed8' }; // default azul (Marles)
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await showHub(session.user);
})();

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const pwd   = document.getElementById('loginPwd').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('loginErr');
  if (!email || !pwd) { err.textContent = 'Preencha e-mail e senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...'; err.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error) { err.textContent = 'E-mail ou senha incorretos.'; btn.disabled = false; btn.textContent = 'Entrar'; return; }
  await showHub(data.user);
}

async function showHub(user) {
  const { data: profile } = await sb.from('profiles').select('role').eq('id', user.id).single();
  const role = profile?.role || 'viewer';
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('hubScreen').style.display   = 'block';
  document.getElementById('userEmail').textContent      = user.email;
  if (role === 'master') document.getElementById('adminLink').style.display = 'inline';
  await loadCompanies();
}

async function loadCompanies() {
  const { data: cats } = await sb.from('categories')
    .select('*, reports(*)')
    .eq('active', true)
    .order('position');

  const container = document.getElementById('companiesContainer');
  if (!cats?.length) { container.innerHTML = '<div class="loading-msg">Nenhum relatório disponível.</div>'; return; }

  container.innerHTML = cats.map(cat => {
    const reports = (cat.reports || []).filter(r => r.active).sort((a,b) => a.position - b.position);
    const colors  = accentColor(cat.title);

    const reportItems = reports.map(r => {
      if (r.coming_soon) {
        return `<div class="report-item soon">
          <div class="report-dot" style="background:${r.color}"></div>
          <div class="report-label">${r.label}</div>
          <div class="report-sub">${r.description}</div>
          <span class="soon-tag">Em breve</span>
        </div>`;
      }
      return `<a class="report-item" href="${r.file_url}">
        <div class="report-dot" style="background:${r.color}"></div>
        <div class="report-label">${r.label}</div>
        <div class="report-sub">${r.description}</div>
        <span class="report-arrow">›</span>
      </a>`;
    }).join('');

    const activeCount  = reports.filter(r => !r.coming_soon).length;
    const badgeText    = activeCount > 0 ? `${activeCount} relatório${activeCount > 1 ? 's' : ''}` : 'Em breve';

    return `<div class="company-card">
      <div class="company-header" style="background:${colors.bg}">
        <div class="company-accent" style="background:${colors.accent}"></div>
        <div class="company-info">
          <div class="company-name">${cat.icon} ${cat.title}</div>
          <div class="company-desc">${cat.description}</div>
        </div>
        <span class="company-badge" style="background:${colors.badge};color:${colors.badgeText}">${badgeText}</span>
      </div>
      <div class="reports-grid">${reportItems}</div>
    </div>`;
  }).join('');
}

async function logout() {
  await sb.auth.signOut();
  document.getElementById('hubScreen').style.display   = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPwd').value   = '';
}
</script>
</body>
</html>
