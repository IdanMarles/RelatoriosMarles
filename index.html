<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marles Têxtil — Relatórios</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f8f9fc; font-family:'DM Sans',sans-serif; min-height:100vh; color:#0f1117; }

/* ── LOGIN ── */
#loginScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.login-box { background:#fff; border:1px solid #e2e5ef; padding:48px 40px; max-width:380px; width:100%; box-shadow:0 4px 24px rgba(0,0,0,.06); }
.brand { font-family:'Playfair Display',serif; font-size:11px; letter-spacing:4px; text-transform:uppercase; color:#7b8099; margin-bottom:10px; text-align:center; }
.login-title { font-family:'Playfair Display',serif; font-size:22px; color:#0f1117; margin-bottom:6px; text-align:center; }
.login-sub { font-size:12px; color:#9ca3af; margin-bottom:32px; text-align:center; }
.field { margin-bottom:12px; }
.field label { display:block; font-size:11px; font-weight:600; color:#7b8099; margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
.field input { width:100%; padding:12px 14px; border:1px solid #e2e5ef; font-family:'DM Sans',sans-serif; font-size:13px; color:#0f1117; outline:none; transition:border .15s; }
.field input:focus { border-color:#1d4ed8; }
.btn-primary { width:100%; padding:13px; background:#0f1117; color:#fff; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; border:none; cursor:pointer; margin-top:8px; transition:background .15s; }
.btn-primary:hover { background:#1d4ed8; }
.btn-primary:disabled { background:#9ca3af; cursor:not-allowed; }
.err-msg { font-size:11px; color:#c8291a; margin-top:10px; text-align:center; min-height:16px; }

/* ── HUB ── */
#hubScreen { display:none; flex-direction:column; min-height:100vh; }
.topbar { background:#fff; border-bottom:3px solid #0f1117; display:flex; align-items:center; justify-content:space-between; padding:0 32px; height:56px; position:sticky; top:0; z-index:200; box-shadow:0 2px 8px rgba(0,0,0,.06); flex-shrink:0; }
.topbar-brand { font-family:'Playfair Display',serif; font-size:12px; letter-spacing:3px; text-transform:uppercase; }
.topbar-right { display:flex; align-items:center; gap:16px; }
.topbar-user { font-size:12px; color:#7b8099; }
.topbar-admin { font-size:11px; font-weight:600; color:#1d4ed8; text-decoration:none; padding:6px 14px; border:1px solid #1d4ed8; transition:all .15s; }
.topbar-admin:hover { background:#1d4ed8; color:#fff; }
.btn-logout { font-size:11px; font-weight:600; color:#7b8099; background:none; border:none; cursor:pointer; }
.btn-logout:hover { color:#c8291a; }

/* ── HUB MENU ── */
#menuScreen { flex:1; overflow-y:auto; }
.hub-content { max-width:800px; margin:0 auto; padding:48px 32px; }
.hub-header { text-align:center; margin-bottom:48px; }
.hub-header h1 { font-family:'Playfair Display',serif; font-size:28px; color:#0f1117; margin-bottom:6px; }
.hub-header p { font-size:12px; color:#9ca3af; }
.category { margin-bottom:36px; }
.cat-header { display:flex; align-items:center; gap:12px; margin-bottom:14px; padding-bottom:10px; border-bottom:2px solid #0f1117; }
.cat-icon { font-size:18px; }
.cat-title { font-family:'Playfair Display',serif; font-size:15px; font-weight:700; }
.cat-desc { font-size:11px; color:#9ca3af; margin-left:auto; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
.card { display:flex; flex-direction:column; gap:6px; padding:18px 20px; background:#fff; border:1px solid #e2e5ef; text-decoration:none; color:#0f1117; transition:all .15s; cursor:pointer; }
.card:hover:not(.soon) { border-color:#1d4ed8; background:#eff4ff; transform:translateY(-1px); box-shadow:0 4px 12px rgba(29,78,216,.08); }
.card.soon { opacity:.4; cursor:default; background:#fafbfd; pointer-events:none; }
.card-dot { width:8px; height:8px; border-radius:2px; }
.card-label { font-size:13px; font-weight:600; }
.card:hover:not(.soon) .card-label { color:#1d4ed8; }
.card-sub { font-size:10px; color:#9ca3af; }
.soon-badge { font-size:9px; font-weight:600; letter-spacing:1px; text-transform:uppercase; background:#f3f4f6; color:#9ca3af; padding:2px 7px; border-radius:2px; align-self:flex-start; }
.loading { text-align:center; padding:80px; color:#9ca3af; }
.footer-hub { text-align:center; margin-top:48px; font-size:10px; color:#d1d5db; }

/* ── IFRAME VIEWER ── */
#viewerScreen { display:none; flex-direction:column; flex:1; }
.viewer-bar { background:#fff; border-bottom:2px solid #0f1117; display:flex; align-items:center; gap:16px; padding:0 24px; height:46px; flex-shrink:0; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.btn-back { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:#0f1117; background:none; border:none; cursor:pointer; padding:0; transition:color .15s; }
.btn-back:hover { color:#1d4ed8; }
.btn-back svg { width:16px; height:16px; }
.viewer-divider { width:1px; height:20px; background:#e2e5ef; }
.viewer-title { font-size:12px; color:#7b8099; }
.viewer-frame { flex:1; border:none; width:100%; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="brand">Marles Têxtil</div>
    <div class="login-title">Relatórios Internos</div>
    <p class="login-sub">Acesso restrito · Uso interno</p>
    <div class="field"><label>E-mail</label><input type="email" id="loginEmail" placeholder="seu@email.com" onkeydown="if(event.key==='Enter')login()"></div>
    <div class="field"><label>Senha</label><input type="password" id="loginPwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn-primary" id="loginBtn" onclick="login()">Entrar</button>
    <div class="err-msg" id="loginErr"></div>
  </div>
</div>

<!-- HUB -->
<div id="hubScreen">

  <!-- Topbar (sempre visível) -->
  <div class="topbar">
    <div class="topbar-brand">Marles Têxtil</div>
    <div class="topbar-right">
      <span class="topbar-user" id="userEmail"></span>
      <a href="admin.html" class="topbar-admin" id="adminLink" style="display:none">⚙ Admin</a>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </div>

  <!-- Menu -->
  <div id="menuScreen">
    <div class="hub-content">
      <div class="hub-header">
        <div class="brand" style="margin-bottom:10px;">Marles Têxtil · Matriz</div>
        <h1>Central de Relatórios</h1>
        <p>Selecione a área que deseja analisar</p>
      </div>
      <div id="categoriesContainer"><div class="loading">Carregando...</div></div>
      <div class="footer-hub">Marles Têxtil · Uso interno</div>
    </div>
  </div>

  <!-- Viewer com iframe -->
  <div id="viewerScreen">
    <div class="viewer-bar">
      <button class="btn-back" onclick="backToMenu()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3L5 8l5 5"/>
        </svg>
        Voltar ao Hub
      </button>
      <div class="viewer-divider"></div>
      <div class="viewer-title" id="viewerTitle"></div>
    </div>
    <iframe class="viewer-frame" id="viewerFrame" src=""></iframe>
  </div>

</div>

<script>
const SURL = 'https://ihlrzanoirwbhftaytbh.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlobHJ6YW5vaXJ3YmhmdGF5dGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMjQ4MTEsImV4cCI6MjA5NDcwMDgxMX0.GuVTLZV-Xlc7YbSslex9Q8lcta0ZBgHfLynFaqOHV5M';
const sb = supabase.createClient(SURL, SKEY);
let userRole = null;

// Check session
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await showHub(session.user);
})();

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const pwd   = document.getElementById('loginPwd').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('loginErr');
  if (!email || !pwd) { err.textContent = 'Preencha e-mail e senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...'; err.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error) {
    err.textContent = 'E-mail ou senha incorretos.';
    btn.disabled = false; btn.textContent = 'Entrar';
    return;
  }
  await showHub(data.user);
}

async function showHub(user) {
  const { data: profile } = await sb.from('profiles').select('role').eq('id', user.id).single();
  userRole = profile?.role || 'viewer';
  document.getElementById('loginScreen').style.display    = 'none';
  document.getElementById('hubScreen').style.display      = 'flex';
  document.getElementById('userEmail').textContent        = user.email;
  if (userRole === 'master') document.getElementById('adminLink').style.display = 'inline';
  await loadCategories();
}

async function loadCategories() {
  const { data: cats } = await sb.from('categories')
    .select('*, reports(*)')
    .eq('active', true)
    .order('position');

  const container = document.getElementById('categoriesContainer');
  if (!cats?.length) { container.innerHTML = '<div class="loading">Nenhum relatório disponível.</div>'; return; }

  container.innerHTML = cats.map(cat => {
    const reports = (cat.reports || []).filter(r => r.active).sort((a,b) => a.position - b.position);
    const cards = reports.map(r => {
      if (r.coming_soon) {
        return `<div class="card soon">
          <div class="card-dot" style="background:${r.color}"></div>
          <div class="card-label">${r.label}</div>
          <div class="card-sub">${r.description}</div>
          <span class="soon-badge">Em breve</span>
        </div>`;
      }
      return `<div class="card" onclick="openReport('${r.file_url}','${r.label}')">
        <div class="card-dot" style="background:${r.color}"></div>
        <div class="card-label">${r.label}</div>
        <div class="card-sub">${r.description}</div>
      </div>`;
    }).join('');

    return `<div class="category">
      <div class="cat-header">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-title">${cat.title}</span>
        <span class="cat-desc">${cat.description}</span>
      </div>
      <div class="cards">${cards}</div>
    </div>`;
  }).join('');
}

function openReport(url, label) {
  document.getElementById('menuScreen').style.display   = 'none';
  document.getElementById('viewerScreen').style.display = 'flex';
  document.getElementById('viewerFrame').src            = url;
  document.getElementById('viewerTitle').textContent    = label;
  // Fix iframe height
  document.getElementById('viewerFrame').style.height   =
    (window.innerHeight - 56 - 46) + 'px';
}

function backToMenu() {
  document.getElementById('viewerScreen').style.display = 'none';
  document.getElementById('menuScreen').style.display   = 'block';
  document.getElementById('viewerFrame').src            = '';
}

async function logout() {
  await sb.auth.signOut();
  document.getElementById('hubScreen').style.display   = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPwd').value   = '';
}

// Adjust iframe height on resize
window.addEventListener('resize', () => {
  const frame = document.getElementById('viewerFrame');
  if (frame.src) frame.style.height = (window.innerHeight - 56 - 46) + 'px';
});
</script>
</body>
</html>
